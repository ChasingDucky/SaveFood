services:
  # MongoDB 数据库
  mongodb:
    image: mongo:7.0
    container_name: savefood-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: savefood2024
      MONGO_INITDB_DATABASE: savefood
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - savefood-network

  # 后端 API 服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: savefood-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5001
      MONGODB_URI: mongodb://admin:savefood2024@mongodb:27017/savefood?authSource=admin
      JWT_SECRET: savefood_jwt_secret_key_2024
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mongodb
    networks:
      - savefood-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: savefood-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5001/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - savefood-network

networks:
  savefood-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
